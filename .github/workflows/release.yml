name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare frontend
        working-directory: src-tauri
        run: node scripts/prepare-frontend.mjs

      - name: Run library tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build release executable
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

      - name: Build Rust installer
        working-directory: setup
        run: cargo build --release

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item "setup/target/release/GuguSetup.exe" "release-artifacts/GuguClient-Setup-windows-x64.exe"

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $notesFile = "docs/devlog/$tag.md"
          $assetName = "GuguClient-Setup-windows-x64.exe"
          $exists = $false
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if ($exists) {
            if (Test-Path $notesFile) {
              & gh release edit $tag --title "Gugu Client $tag" --notes-file $notesFile
            }
            $oldAssets = & gh release view $tag --json assets --jq ".assets[].name"
            foreach ($old in $oldAssets) {
              if ($old -and $old -ne $assetName) {
                & gh release delete-asset $tag $old --yes
              }
            }
            & gh release upload $tag "release-artifacts/$assetName" --clobber
          } else {
            $ghArgs = @(
              "release", "create", $tag,
              "release-artifacts/$assetName",
              "--title", "Gugu Client $tag"
            )
            if (Test-Path $notesFile) {
              $ghArgs += @("--notes-file", $notesFile)
            } else {
              $ghArgs += "--generate-notes"
            }
            & gh @ghArgs
          }
