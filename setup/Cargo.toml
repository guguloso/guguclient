[package]
name = "gugu-setup"
version = "1.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "GuguSetup"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
