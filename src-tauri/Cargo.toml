[package]
name = "gugu-client"
version = "1.1.0"
description = "Gugu Client for Roblox — native Rust runtime (Tauri)"
authors = ["guguloso"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "gugu_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# The updater and single-instance logic look for `GuguClient.exe`.
name = "GuguClient"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Runtime / UI shell: the existing React renderer runs unchanged in WebView2.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# Native open/save dialogs (Electron `dialog.showOpenDialog`).
rfd = { version = "0.15", default-features = false }

# Serialization: the IPC contract is JSON, identical to Electron's.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Async + concurrency
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "io-util", "net"] }
futures = "0.3"
parking_lot = "0.12"

# HTTP (Roblox web APIs). rustls avoids an OpenSSL dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
bytes = "1"
urlencoding = "2"
regex = "1"
num-bigint = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
trash = "5"

# Errors and logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Storage, caching, crypto (Electron safeStorage compatible)
dirs = "6"
lru = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# zstd-compressed rbxm chunks (pure Rust, like the Electron build's fzstd).
ruzstd = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
] }

[features]
# Serve the embedded UI (dist-tauri) instead of a dev server; release builds
# pass `--features custom-protocol` (what `tauri build` does).
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
# Thin LTO: fat LTO with one codegen unit exhausts memory on 8 GB machines.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev.package."*"]
# Dependencies are compiled optimized even in dev so the UI stays snappy.
opt-level = 2

[profile.dev]
# Line tables only: full debuginfo exhausts memory when LLVM codegens the
# large service modules on low-RAM machines.
debug = "line-tables-only"
